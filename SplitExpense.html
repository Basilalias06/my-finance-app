<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1d27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Split Expenses - FinTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #000;
            --bg-1: #0A0A0A;
            --bg-2: #141414;
            --bg-3: #1E1E1E;
            --bg-4: #282828;
            --bg-5: #333;
            --primary: #80CBC4;
            --expense: #EF9A9A;
            --income: #A5D6A7;
            --transfer: #90CAF9;
            --warning: #E8B06E;
            --text-primary: #FFFFFF;
            --text-secondary: #B3B3B3;
            --text-tertiary: #808080;
            --border: #3A3A3A;
        }

        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: 'Roboto', 'Google Sans Text', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* Top Bar */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-bar__back {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--bg-3);
            border: none;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 24px;
            transition: background 0.2s;
        }

        .top-bar__back:hover {
            background: var(--bg-4);
        }

        .top-bar__title {
            flex: 1;
            font-size: 18px;
            font-weight: 600;
            font-family: 'Roboto', 'Google Sans', sans-serif;
        }

        /* Main Content */
        .container {
            padding: 0 16px 120px 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .section {
            margin-bottom: 24px;
        }

        .section__title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Balance Summary Card */
        .balance-card {
            background: linear-gradient(135deg, var(--bg-3) 0%, var(--bg-2) 100%);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .balance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .balance-row:last-child {
            margin-bottom: 0;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        .balance-label {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .balance-amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 600;
        }

        .balance-amount.owed {
            color: var(--income);
        }

        .balance-amount.owes {
            color: var(--expense);
        }

        .balance-amount.net {
            color: var(--primary);
            font-size: 24px;
        }

        /* Friends List */
        .friend-card {
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .friend-card:hover {
            background: var(--bg-3);
            border-color: #4A4A4A;
        }

        .friend-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .friend-avatar {
            width: 44px;
            height: 44px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            color: #000;
        }

        .avatar-rahul {
            background: #42A5F5;
        }

        .avatar-priya {
            background: #AB47BC;
        }

        .avatar-amit {
            background: #FF7043;
        }

        .avatar-sneha {
            background: #EC407A;
        }

        .avatar-vikram {
            background: #26A69A;
        }

        .friend-info {
            flex: 1;
        }

        .friend-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .friend-activity {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .friend-amount {
            text-align: right;
        }

        .friend-amount__value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .friend-amount__value.owed {
            color: var(--income);
        }

        .friend-amount__value.owes {
            color: var(--expense);
        }

        .friend-amount__value.settled {
            color: var(--text-tertiary);
        }

        .friend-amount__label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .friend-card.expanded {
            background: var(--bg-3);
        }

        .friend-history {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .friend-card.expanded .friend-history {
            display: block;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .history-item:last-child {
            margin-bottom: 0;
        }

        .history-desc {
            color: var(--text-secondary);
        }

        .history-amount {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
        }

        /* Recent Splits */
        .split-item {
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .split-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .split-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .split-title {
            font-size: 14px;
            font-weight: 600;
            margin: 4px 0;
        }

        .split-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .split-amount {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-primary);
            font-weight: 500;
        }

        /* Groups Section */
        .group-card {
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .group-info {
            flex: 1;
        }

        .group-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .group-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .group-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            text-align: right;
        }

        .group-status.unsettled {
            color: var(--warning);
        }

        .group-status.settled {
            color: var(--income);
        }

        /* Buttons */
        .add-button {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--bg-3);
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .add-button:hover {
            background: var(--bg-4);
        }

        .button-primary {
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .button-primary:hover {
            opacity: 0.9;
        }

        .button-secondary {
            background: var(--bg-3);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .button-secondary:hover {
            background: var(--bg-4);
        }

        /* FAB - Floating Action Button */
        .fab {
            position: fixed;
            bottom: 92px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 100px;
            background: var(--primary);
            color: #000;
            border: none;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(128, 203, 196, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 150;
        }

        .fab:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(128, 203, 196, 0.4);
        }

        .fab:active {
            transform: scale(0.95);
        }

        /* Floating Nav Bar */
        .floating-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 8px;
            background: rgba(14, 14, 14, 0.92);
            backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--border);
            border-radius: 100px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
        }

        .nav-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            text-decoration: none;
        }

        .nav-icon:hover {
            background: var(--bg-3);
        }

        /* Bottom Sheet */
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-1);
            border-top: 1px solid var(--border);
            border-radius: 24px 24px 0 0;
            padding: 24px 16px 32px 16px;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 300;
            display: none;
            animation: slideUp 0.3s ease-out;
        }

        .bottom-sheet.active {
            display: block;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .bottom-sheet__handle {
            width: 40px;
            height: 4px;
            background: var(--border);
            border-radius: 100px;
            margin: 0 auto 16px auto;
        }

        .bottom-sheet__title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-input::placeholder {
            color: var(--text-tertiary);
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-2);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .checkbox-item:hover {
            background: var(--bg-3);
        }

        .checkbox-item input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .checkbox-label {
            flex: 1;
            cursor: pointer;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-2);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .radio-item:hover {
            background: var(--bg-3);
        }

        .radio-item input {
            cursor: pointer;
            accent-color: var(--primary);
        }

        .radio-label {
            flex: 1;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .button-group button {
            flex: 1;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-4);
            color: var(--text-primary);
            padding: 12px 20px;
            border-radius: 100px;
            font-size: 13px;
            border: 1px solid var(--border);
            z-index: 250;
            animation: slideIn 0.3s ease-out;
            display: none;
        }

        .toast.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 0 12px 120px 12px;
            }

            .balance-card {
                padding: 16px;
            }

            .friend-card,
            .split-item,
            .group-card {
                border-radius: 12px;
            }

            .fab {
                right: 16px;
                width: 52px;
                height: 52px;
                font-size: 24px;
            }
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 16px 0;
        }

        .text-center {
            text-align: center;
        }

        .mt-24 {
            margin-top: 24px;
        }
        .nav-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;align-items:center;gap:4px;padding:6px 8px;background:rgba(14,14,14,0.92);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid #3A3A3A;border-radius:100px;box-shadow:0 8px 32px rgba(0,0,0,0.7)}
        .nav-item{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:#79747E;border-radius:16px;cursor:pointer;transition:all .2s}
        .nav-item .material-symbols-rounded{font-size:22px;transition:all .2s}
        .nav-item:hover{color:#CAC4D0;background:#242424}
        .nav-item.active{color:#80CBC4;background:rgba(128,203,196,0.12)}
        .nav-item.active .material-symbols-rounded{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
    </style>
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <button class="top-bar__back" onclick="navigateToMainMenu()">
            <span class="material-symbols-rounded">arrow_back</span>
        </button>
        <h1 class="top-bar__title">Split Expenses</h1>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Balance Summary Card -->
        <div class="balance-card" id="balanceCard"></div>

        <!-- Friends Section -->
        <div class="section">
            <div class="section__title">
                <span>Friends</span>
                <button class="add-button" onclick="openAddPerson()" title="Add person">
                    <span class="material-symbols-rounded">add</span>
                </button>
            </div>
            <div id="friendsContainer"></div>
        </div>

        <!-- Recent Splits -->
        <div class="section">
            <div class="section__title">Recent Splits</div>
            <div id="splitsContainer"></div>
        </div>
    </div>

    <!-- FAB -->
    <button class="fab" onclick="openAddSplit()" title="Add split">
        <span class="material-symbols-rounded">add</span>
    </button>

    <!-- Add Split Bottom Sheet -->
    <div class="bottom-sheet" id="addSplitSheet">
        <div class="bottom-sheet__handle"></div>
        <h2 class="bottom-sheet__title">Add Split</h2>

        <form onsubmit="handleAddSplit(event)">
            <div class="form-group">
                <label class="form-label">Description</label>
                <input class="form-input" type="text" id="splitDesc" placeholder="e.g., Dinner, Movie, Groceries" required>
            </div>

            <div class="form-group">
                <label class="form-label">Total Amount</label>
                <input class="form-input" type="number" id="splitTotal" placeholder="0" min="0" step="1" required>
            </div>

            <div class="form-group">
                <label class="form-label">Paid By</label>
                <div class="radio-group" id="paidByGroup"></div>
            </div>

            <div class="form-group">
                <label class="form-label">Split Between</label>
                <div class="checkbox-group" id="splitBetweenGroup"></div>
            </div>

            <div class="form-group">
                <label class="form-label">Split Type</label>
                <div class="radio-group">
                    <label class="radio-item">
                        <input type="radio" name="splitType" value="equal" checked>
                        <span class="radio-label">Equal</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="splitType" value="unequal">
                        <span class="radio-label">Unequal</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="splitType" value="percentage">
                        <span class="radio-label">Percentage</span>
                    </label>
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="button-secondary" onclick="closeAddSplit()">Cancel</button>
                <button type="submit" class="button-primary">Save</button>
            </div>
        </form>
    </div>

    <!-- Settle Up Bottom Sheet -->
    <div class="bottom-sheet" id="settleUpSheet">
        <div class="bottom-sheet__handle"></div>
        <h2 class="bottom-sheet__title">Settle Up</h2>

        <div id="settleUpContent">
            <div class="form-group" style="margin-bottom: 24px;">
                <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 8px;">Amount to settle</p>
                <p id="settleAmount" style="font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 600; color: var(--primary);">₹0</p>
            </div>

            <div class="form-group">
                <label class="form-label">Payment Method</label>
                <div class="radio-group">
                    <label class="radio-item">
                        <input type="radio" name="paymentMethod" value="cash" checked>
                        <span class="radio-label">Cash</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="paymentMethod" value="upi">
                        <span class="radio-label">UPI</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="paymentMethod" value="bank">
                        <span class="radio-label">Bank Transfer</span>
                    </label>
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="button-secondary" onclick="closeSettleUp()">Cancel</button>
                <button type="button" class="button-primary" onclick="confirmSettleUp()">Mark as Settled</button>
            </div>
        </div>
    </div>

    <!-- Add Person Bottom Sheet -->
    <div class="bottom-sheet" id="addPersonSheet">
        <div class="bottom-sheet__handle"></div>
        <h2 class="bottom-sheet__title">Add Person</h2>

        <form onsubmit="handleAddPerson(event)">
            <div class="form-group">
                <label class="form-label">Name</label>
                <input class="form-input" type="text" placeholder="Enter name" required>
            </div>

            <div class="form-group">
                <label class="form-label">Phone (Optional)</label>
                <input class="form-input" type="tel" placeholder="+91 98765 43210">
            </div>

            <div class="form-group">
                <label class="form-label">Email (Optional)</label>
                <input class="form-input" type="email" placeholder="email@example.com">
            </div>

            <div class="button-group">
                <button type="button" class="button-secondary" onclick="closeAddPerson()">Cancel</button>
                <button type="submit" class="button-primary">Add Person</button>
            </div>
        </form>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Floating Nav Bar -->
    <div class="floating-nav">
        <a href="MainMenu.html" class="nav-icon" title="Home">
            <span class="material-symbols-rounded">home</span>
        </a>
        <a href="AllTransactions.html" class="nav-icon" title="Transactions">
            <span class="material-symbols-rounded">description</span>
        </a>
        <a href="Accounts.html" class="nav-icon" title="Accounts">
            <span class="material-symbols-rounded">account_balance</span>
        </a>
        <a href="Reports.html" class="nav-icon" title="Reports">
            <span class="material-symbols-rounded">analytics</span>
        </a>
        <a href="Settings.html" class="nav-icon" title="Settings">
            <span class="material-symbols-rounded">settings</span>
        </a>
    </div>

    <script src="fintrack-data.js"></script>
<script src="fintrack-sync.js"></script>
<script src="fintrack-validation.js"></script>
<script src="fintrack-auth.js"></script>
<script src="fintrack-ui.js"></script>
<script>
        // ── Navigation ──────────────────────
        function navigateToMainMenu() { window.location.href = 'MainMenu.html'; }

        // ── Toast ───────────────────────────
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ── Format helper ───────────────────
        function fmt(n) {
            return new Intl.NumberFormat('en-IN', { style:'currency', currency:'INR', minimumFractionDigits:0, maximumFractionDigits:0 }).format(Math.abs(n));
        }

        // ── Compute balances from splits ────
        function computeBalances() {
            const splits = FT.getSplits();
            const balances = {}; // positive = they owe you, negative = you owe them

            splits.forEach(sp => {
                const yourShare = sp.shares && sp.shares['you'] ? sp.shares['you'] : 0;
                if (sp.paidBy === 'you') {
                    // Others owe you their share
                    Object.entries(sp.shares || {}).forEach(([person, amount]) => {
                        if (person !== 'you') {
                            balances[person] = (balances[person] || 0) + amount;
                        }
                    });
                } else {
                    // You owe the payer your share
                    balances[sp.paidBy] = (balances[sp.paidBy] || 0) - yourShare;
                }
            });
            return balances;
        }

        // ── Render the page ─────────────────
        function renderPage() {
            const friends = FT.getSplitFriends();
            const splits = FT.getSplits();
            const balances = computeBalances();

            // Balance card
            let owed = 0, owes = 0;
            Object.values(balances).forEach(v => { if (v > 0) owed += v; else owes += Math.abs(v); });
            const net = owed - owes;
            document.getElementById('balanceCard').innerHTML = `
                <div class="balance-row"><span class="balance-label">You are owed</span><span class="balance-amount owed">${fmt(owed)}</span></div>
                <div class="balance-row"><span class="balance-label">You owe</span><span class="balance-amount owes">${fmt(owes)}</span></div>
                <div class="balance-row"><span class="balance-label">Net Balance</span><span class="balance-amount net">${net >= 0 ? '+' : '-'}${fmt(net)}</span></div>`;

            // Friends
            const friendsHtml = friends.map(f => {
                const bal = balances[f.name] || 0;
                const initial = f.name.charAt(0);
                const amtClass = bal > 0 ? 'owed' : bal < 0 ? 'owes' : 'settled';
                const label = bal > 0 ? 'Owes you' : bal < 0 ? 'You owe' : 'Settled up';
                const amtDisplay = bal === 0 ? '&#10003;' : fmt(bal);

                // Recent splits involving this friend
                const friendSplits = splits.filter(sp =>
                    sp.paidBy === f.name || (sp.shares && sp.shares[f.name] !== undefined)
                );
                const lastSplit = friendSplits[0];
                const activity = lastSplit ? lastSplit.desc + ' — ' + new Date(lastSplit.date).toLocaleDateString('en-IN', {month:'short', day:'numeric'}) : 'No activity';

                const historyHtml = friendSplits.slice(0, 3).map(sp =>
                    `<div class="history-item"><span class="history-desc">${sp.desc}</span><span class="history-amount">${fmt(sp.shares && sp.shares[f.name] ? sp.shares[f.name] : sp.total)}</span></div>`
                ).join('');

                return `<div class="friend-card" onclick="toggleFriendHistory(this)">
                    <div class="friend-header">
                        <div class="friend-avatar" style="background:${f.color}">${initial}</div>
                        <div class="friend-info">
                            <div class="friend-name">${f.name}</div>
                            <div class="friend-activity">${activity}</div>
                        </div>
                        <div class="friend-amount">
                            <div class="friend-amount__value ${amtClass}">${amtDisplay}</div>
                            <div class="friend-amount__label">${label}</div>
                        </div>
                    </div>
                    <div class="friend-history">
                        ${historyHtml || '<div class="history-item"><span class="history-desc">No splits yet</span><span class="history-amount">-</span></div>'}
                        ${bal !== 0 ? '<div class="divider"></div><button class="button-primary" style="width:100%;margin-top:12px" onclick="event.stopPropagation();openSettleUp(\'' + f.name + '\',' + Math.abs(bal) + ')">Settle up</button>' : ''}
                    </div>
                </div>`;
            }).join('');
            document.getElementById('friendsContainer').innerHTML = friendsHtml || '<p style="text-align:center;padding:16px;color:var(--text-secondary)">No friends added yet</p>';

            // Recent splits
            document.getElementById('splitsContainer').innerHTML = splits.length ? splits.slice(0, 10).map(sp => {
                const ways = sp.members ? sp.members.length : Object.keys(sp.shares || {}).length;
                const yourShare = sp.shares && sp.shares['you'] ? sp.shares['you'] : 0;
                return `<div class="split-item">
                    <div class="split-header"><div>
                        <div class="split-date">${new Date(sp.date).toLocaleDateString('en-IN', {month:'short', day:'numeric', year:'numeric'})}</div>
                        <div class="split-title">${sp.desc}</div>
                    </div></div>
                    <div class="split-details">
                        <div>Total: <span class="split-amount">${fmt(sp.total)}</span></div>
                        <div>Paid by: ${sp.paidBy === 'you' ? 'You' : sp.paidBy}</div>
                        <div>Split: ${ways} ways</div>
                        <div>Your share: <span class="split-amount">${fmt(yourShare)}</span></div>
                    </div>
                </div>`;
            }).join('') : '<p style="text-align:center;padding:16px;color:var(--text-secondary)">No splits yet</p>';
        }

        // ── Friend History Toggle ───────────
        function toggleFriendHistory(element) {
            element.classList.toggle('expanded');
        }

        // ── Add Split ───────────────────────
        function openAddSplit() {
            document.getElementById('splitDesc').value = '';
            document.getElementById('splitTotal').value = '';
            // Populate dynamic friend lists
            const friends = FT.getSplitFriends();
            document.getElementById('paidByGroup').innerHTML =
                '<label class="radio-item"><input type="radio" name="paidBy" value="you" checked><span class="radio-label">You</span></label>' +
                friends.map(f => '<label class="radio-item"><input type="radio" name="paidBy" value="' + f.name + '"><span class="radio-label">' + f.name + '</span></label>').join('');
            document.getElementById('splitBetweenGroup').innerHTML =
                friends.map(f => '<label class="checkbox-item"><input type="checkbox" value="' + f.name + '" checked><span class="checkbox-label">' + f.name + '</span></label>').join('');
            document.getElementById('addSplitSheet').classList.add('active');
        }

        function closeAddSplit() { document.getElementById('addSplitSheet').classList.remove('active'); }

        function handleAddSplit(event) {
            event.preventDefault();
            const desc = document.getElementById('splitDesc').value.trim();
            const total = parseFloat(document.getElementById('splitTotal').value) || 0;
            const paidBy = document.querySelector('input[name="paidBy"]:checked')?.value || 'you';
            const checkedMembers = Array.from(document.querySelectorAll('#splitBetweenGroup input:checked')).map(cb => cb.value);
            if (!desc || !total) { showToast('Please fill description and amount'); return; }

            const members = ['you', ...checkedMembers];
            const perPerson = Math.round(total / members.length);
            const shares = {};
            members.forEach(m => shares[m] = perPerson);

            FT.addSplit({ desc, total, paidBy, date: new Date().toISOString().slice(0,10), splitType: 'equal', members, shares });
            showToast('Split added successfully');
            closeAddSplit();
            renderPage();
        }

        // ── Settle Up ──────────────────────
        let settlingName = null;
        let settlingAmount = 0;

        function openSettleUp(name, amount) {
            settlingName = name;
            settlingAmount = amount;
            document.getElementById('settleAmount').textContent = fmt(amount);
            document.getElementById('settleUpSheet').classList.add('active');
        }

        function closeSettleUp() { document.getElementById('settleUpSheet').classList.remove('active'); }

        function confirmSettleUp() {
            if (!settlingName) return;
            // Add a settlement split that zeroes out the balance
            const balances = computeBalances();
            const bal = balances[settlingName] || 0;

            if (bal > 0) {
                // They owed you — they pay you
                FT.addSplit({ desc: 'Settlement with ' + settlingName, total: Math.abs(bal), paidBy: settlingName, date: new Date().toISOString().slice(0,10), splitType: 'equal', members: ['you', settlingName], shares: { 'you': 0, [settlingName]: Math.abs(bal) } });
            } else if (bal < 0) {
                // You owed them — you pay them
                FT.addSplit({ desc: 'Settlement with ' + settlingName, total: Math.abs(bal), paidBy: 'you', date: new Date().toISOString().slice(0,10), splitType: 'equal', members: ['you', settlingName], shares: { 'you': Math.abs(bal), [settlingName]: 0 } });
            }
            showToast('Settled up with ' + settlingName);
            closeSettleUp();
            renderPage();
        }

        // ── Add Person ──────────────────────
        function openAddPerson() { document.getElementById('addPersonSheet').classList.add('active'); }
        function closeAddPerson() { document.getElementById('addPersonSheet').classList.remove('active'); }

        function handleAddPerson(event) {
            event.preventDefault();
            const inputs = document.querySelectorAll('#addPersonSheet .form-input');
            const name = inputs[0].value.trim();
            if (!name) { showToast('Please enter a name'); return; }

            const colors = ['#42A5F5','#AB47BC','#FF7043','#EC407A','#26A69A','#FFA726','#66BB6A','#78909C'];
            const color = colors[FT.getSplitFriends().length % colors.length];
            FT.addSplitFriend({ name, phone: inputs[1]?.value || '', email: inputs[2]?.value || '', color });
            inputs.forEach(i => i.value = '');
            showToast(name + ' added');
            closeAddPerson();
            renderPage();
        }

        // ── Init ────────────────────────────
        FTTheme.init();
        renderPage();
    </script>

  window.addEventListener("load", () => {
